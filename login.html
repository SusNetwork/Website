<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SusNetwork - Log in</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f1115; color: #e6e6e6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      width: min(420px, 92vw); padding: 2rem;
      background: #171a21; border: 1px solid #262b36; border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; text-align: center; }
    p.sub { margin: 0 0 1.5rem; text-align: center; color: #9aa3b2; font-size: .95rem; }
    label { display: block; margin: .9rem 0 .35rem; font-size: .9rem; color: #c3c9d4; }
    input[type=email] {
      width: 100%; padding: .7rem .8rem; border-radius: 8px;
      border: 1px solid #323948; background: #0f1115; color: inherit; font-size: 1rem;
    }
    input:focus { outline: none; border-color: #6c8cff; }
    .captcha { margin-top: 1.2rem; display: flex; justify-content: center; }
    button {
      width: 100%; margin-top: 1.2rem; padding: .8rem; border: 0; border-radius: 8px;
      background: #6c8cff; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #msg { min-height: 1.4em; margin: 1rem 0 0; text-align: center; font-size: .95rem; }
    #msg.ok { color: #5fd38d; }
    #msg.err { color: #ff7b7b; }
    footer { margin-top: 1.5rem; font-size: .85rem; color: #6b7280; }
    footer a { color: #9aa3b2; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Log in</h1>
    <p class="sub">Get a login link by email</p>

    <form id="form" novalidate>
      <label for="email">Email address</label>
      <input id="email" type="email" name="email" required autocomplete="email">

      <div class="captcha">
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAGJDCCWogCokObwT"
             data-theme="dark"
             data-callback="onCaptcha"
             data-expired-callback="offCaptcha"
             data-error-callback="offCaptcha"></div>
      </div>

      <button id="btn" type="submit" disabled>Send login link</button>
    </form>

    <p id="msg" role="status"></p>
  </main>

  <footer><a href="signup.html">Create an account</a></footer>

  <script>
    const API = 'https://api.susnetwork.isroot.in';
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    function show(text, ok) {
      msg.textContent = text;
      msg.className = ok ? 'ok' : 'err';
    }

    // Arrival from the email link: the token is in the fragment (#token=...),
    // so it is never sent to the web server or logged by nginx.
    const linkToken = new URLSearchParams(location.hash.slice(1)).get('token');
    if (linkToken) {
      history.replaceState(null, '', location.pathname); // remove the token from the address bar
      form.hidden = true;
      show('Logging you in…', true);
      (async () => {
        try {
          const res = await fetch(API + '/login/verify', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: linkToken }),
          });
          const json = await res.json().catch(() => ({ message: 'Unexpected error.' }));
          if (res.ok) {
            location.replace('account.html');
          } else {
            show(json.message, false);
            form.hidden = false;
          }
        } catch {
          show('Unable to connect, please try again.', false);
          form.hidden = false;
        }
      })();
    }

    function onCaptcha() { btn.disabled = false; }
    function offCaptcha() { btn.disabled = true; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = '';
      msg.textContent = '';
      const data = Object.fromEntries(new FormData(form));
      data.email = data.email.trim().toLowerCase();

      btn.disabled = true;
      try {
        const res = await fetch(API + '/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json().catch(() => ({ message: 'Unexpected error.' }));
        show(json.message, res.ok);
      } catch {
        show('Unable to connect, please try again.', false);
      } finally {
        if (window.turnstile) turnstile.reset();
        btn.disabled = true;
      }
    });
  </script>
</body>
</html>
