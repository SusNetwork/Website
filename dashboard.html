<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SusNetwork - Administration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1rem; min-height: 100vh;
      background: #0f1115; color: #e6e6e6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .msg { min-height: 1.4em; margin: 0 0 1rem; font-size: .95rem; }
    .msg.ok { color: #5fd38d; }
    .msg.err { color: #ff7b7b; }
    .wrap { overflow-x: auto; background: #171a21; border: 1px solid #262b36; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #262b36; white-space: nowrap; }
    th { color: #9aa3b2; font-weight: 600; }
    code { color: #8ea6ff; }
    button {
      padding: .4rem .7rem; border: 0; border-radius: 6px;
      background: #d9534f; color: #fff; font-size: .85rem; cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <h1>Account administration</h1>
    <p id="msg" class="msg" role="status"></p>

    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>First name</th><th>Email</th><th>Friend code</th>
            <th>Code changed</th><th>Created on</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script>
    const API = 'https://api.susnetwork.isroot.in';
    const $ = (id) => document.getElementById(id);

    // Any non-OK response (not admin, no session, server error) shows the same 500 page.
    function serverError() {
      document.body.innerHTML =
        '<main style="text-align:center;padding:4rem 1rem;font-family:system-ui,sans-serif;color:#e6e6e6">' +
        '<p style="font-size:5rem;font-weight:700;color:#6c8cff;margin:0">500</p>' +
        '<h1 style="font-size:1.4rem;margin:.5rem 0 .75rem">An internal error occurred</h1>' +
        '<p style="color:#9aa3b2">The requested page could not be displayed.</p>' +
        '<a href="/" style="color:#c3c9d4">Back to home</a></main>';
      document.body.style.background = '#0f1115';
    }

    function showMsg(text, ok) {
      $('msg').textContent = text;
      $('msg').className = ok ? 'msg ok' : 'msg err';
    }

    function cell(text) {
      const td = document.createElement('td');
      td.textContent = text;
      return td;
    }

    function render(rows) {
      const tbody = $('rows');
      tbody.textContent = '';
      for (const r of rows) {
        const tr = document.createElement('tr');
        tr.appendChild(cell(r.id));
        tr.appendChild(cell(r.first_name));
        tr.appendChild(cell(r.email));

        const code = document.createElement('td');
        const c = document.createElement('code');
        c.textContent = r.friend_code;
        code.appendChild(c);
        tr.appendChild(code);

        tr.appendChild(cell(r.code_changed ? 'yes' : 'no'));
        tr.appendChild(cell(new Date(r.created_at + 'Z').toLocaleString('en-GB')));

        const act = document.createElement('td');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Delete';
        btn.addEventListener('click', () => remove(r.id, r.email));
        act.appendChild(btn);
        tr.appendChild(act);

        tbody.appendChild(tr);
      }
    }

    async function load() {
      let res;
      try {
        res = await fetch(API + '/admin/dash', { credentials: 'include' });
      } catch {
        serverError();
        return;
      }
      if (!res.ok) {
        serverError();
        return;
      }
      const rows = await res.json();
      render(rows);
      showMsg(rows.length + ' account(s).', true);
    }

    async function remove(id, email) {
      if (!confirm('Permanently delete the account ' + email + '?')) return;
      const res = await fetch(API + '/admin/accounts/' + encodeURIComponent(id), {
        method: 'DELETE',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const json = await res.json().catch(() => ({ message: 'Unexpected error.' }));
      showMsg(json.message, res.ok);
      if (res.ok) load();
    }

    load();
  </script>
</body>
</html>
