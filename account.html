<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SusNetwork - My account</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f1115; color: #e6e6e6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      width: min(460px, 92vw); padding: 2rem;
      background: #171a21; border: 1px solid #262b36; border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.5rem; text-align: center; }
    h2 { margin: 1.8rem 0 .6rem; font-size: 1.05rem; color: #c3c9d4; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: .5rem 1rem; margin: 0; }
    dt { color: #9aa3b2; font-size: .9rem; }
    dd { margin: 0; word-break: break-all; }
    code { font-size: 1.05rem; color: #8ea6ff; }
    label { display: block; margin: .9rem 0 .35rem; font-size: .9rem; color: #c3c9d4; }
    input[type=text] {
      width: 100%; padding: .7rem .8rem; border-radius: 8px;
      border: 1px solid #323948; background: #0f1115; color: inherit; font-size: 1rem;
    }
    input:focus { outline: none; border-color: #6c8cff; }
    .captcha { margin-top: 1rem; display: flex; justify-content: center; }
    button {
      width: 100%; margin-top: 1rem; padding: .75rem; border: 0; border-radius: 8px;
      background: #6c8cff; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.danger { background: #d9534f; }
    button.ghost { background: transparent; border: 1px solid #323948; color: #9aa3b2; }
    .hint { font-size: .85rem; color: #9aa3b2; margin: .4rem 0 0; }
    .msg { min-height: 1.4em; margin: .8rem 0 0; text-align: center; font-size: .95rem; }
    .msg.ok { color: #5fd38d; }
    .msg.err { color: #ff7b7b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>My SusNetwork account</h1>

    <p id="global" class="msg err" role="status"></p>

    <section id="content" hidden>
      <dl>
        <dt>First name</dt><dd id="first_name"></dd>
        <dt>Email</dt><dd id="email"></dd>
        <dt>Friend code</dt><dd><code id="friend_code"></code></dd>
        <dt>Created on</dt><dd id="created_at"></dd>
      </dl>

      <h2>Change friend code</h2>
      <div id="change-box">
        <form id="change-form" novalidate>
          <label for="new_code">New friend code</label>
          <input id="new_code" type="text" name="friend_code" required
                 pattern="[a-z]{6,10}#[0-9]{4}" placeholder="newname#1234">
          <p class="hint">You can only change it once. The old code is released immediately.</p>

          <div class="captcha">
            <div class="cf-turnstile"
                 data-sitekey="0x4AAAAAAGJDCCWogCokObwT"
                 data-theme="dark"
                 data-callback="onChangeCaptcha"
                 data-expired-callback="offChangeCaptcha"
                 data-error-callback="offChangeCaptcha"></div>
          </div>

          <button id="change-btn" type="submit" disabled>Change my friend code</button>
          <p id="change-msg" class="msg" role="status"></p>
        </form>
      </div>
      <p id="change-used" class="hint" hidden>You have already used your one friend code change.</p>

      <h2>Delete my account</h2>
      <p class="hint">Permanently deletes your account, your friend code and all your data.</p>
      <button id="delete-btn" class="danger" type="button">Delete my account</button>

      <button id="logout-btn" class="ghost" type="button">Log out</button>
    </section>
  </main>

  <script>
    const API = 'https://api.susnetwork.isroot.in';
    const $ = (id) => document.getElementById(id);

    // Every call sends the session cookie (credentials: 'include').
    async function api(method, path, body) {
      const opts = { method, credentials: 'include', headers: {} };
      if (body) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      try {
        const res = await fetch(API + path, opts);
        const data = await res.json().catch(() => ({ message: 'Unexpected error.' }));
        return { ok: res.ok, status: res.status, data };
      } catch {
        return { ok: false, status: 0, data: { message: 'Unable to connect.' } };
      }
    }

    function showGlobal(text, ok = false) {
      $('global').textContent = text;
      $('global').className = ok ? 'msg ok' : 'msg err';
    }

    async function load() {
      const r = await api('GET', '/account');
      if (r.status === 401) {
        location.replace('login.html');
        return;
      }
      if (!r.ok) {
        showGlobal(r.data.message);
        return;
      }
      $('first_name').textContent = r.data.first_name;
      $('email').textContent = r.data.email;
      $('friend_code').textContent = r.data.friend_code;
      $('created_at').textContent = new Date(r.data.created_at + 'Z').toLocaleString('en-GB');

      if (r.data.code_changed) {
        $('change-box').hidden = true;
        $('change-used').hidden = false;
      }
      showGlobal('');
      $('content').hidden = false;
    }

    function onChangeCaptcha() { $('change-btn').disabled = false; }
    function offChangeCaptcha() { $('change-btn').disabled = true; }

    $('change-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      data.friend_code = data.friend_code.trim().toLowerCase();

      $('change-btn').disabled = true;
      const r = await api('POST', '/account/friend-code', data);
      $('change-msg').textContent = r.data.message;
      $('change-msg').className = r.ok ? 'msg ok' : 'msg err';

      if (window.turnstile) turnstile.reset();
      if (r.ok) {
        e.target.reset();
        load();
      }
    });

    $('delete-btn').addEventListener('click', async () => {
      const ok = confirm('Permanently delete your account? Your friend code will be released and all your data erased.');
      if (!ok) return;
      const r = await api('DELETE', '/account', {});
      if (r.ok) {
        $('content').hidden = true;
        showGlobal(r.data.message, true);
      } else {
        showGlobal(r.data.message);
      }
    });

    $('logout-btn').addEventListener('click', async () => {
      await api('POST', '/logout', {});
      location.replace('login.html');
    });

    load();
  </script>
</body>
</html>
