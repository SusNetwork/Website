<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · SusNetwork</title>
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/351146476?s=200&v=4">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #080d16;
      color: #e8eef7;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      opacity: .3;
      box-shadow: 0 0 7px rgba(255,255,255,.45);
      animation: moveParticle linear infinite;
    }

    @keyframes moveParticle {
      0% {
        transform: translateX(-12vw);
        opacity: 0;
      }

      8% {
        opacity: .3;
      }

      92% {
        opacity: .3;
      }

      100% {
        transform: translateX(112vw);
        opacity: 0;
      }
    }

    .page {
      width: min(620px, 100%);
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 15px;
      margin-bottom: 28px;
    }

    .error {
      font-size: 92px;
      line-height: 1;
      letter-spacing: -0.07em;
      font-weight: 800;
      color: #fff;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 24px;
      color: #f1f5fa;
      margin-bottom: 14px;
    }

    p {
      color: #8998ab;
      font-size: 15px;
      line-height: 1.7;
    }

    .home {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 17px;
      border: 1px solid #25364e;
      border-radius: 9px;
      color: #c9d9ee;
      font-size: 14px;
      transition: .2s;
    }

    .home:hover {
      border-color: #527fbd;
      color: #fff;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>

  <div id="particles" aria-hidden="true"></div>

  <main class="page">
    <img
      class="logo"
      src="https://avatars.githubusercontent.com/u/351146476?s=200&v=4"
      alt="SusNetwork logo"
    >

    <div class="error">404</div>

    <h1>Looks like that's a 404 page.</h1>

    <p>
      You were looking for something?
      I unfortunately searched but found nothing.
      It might've been ejected to space... maybe?
    </p>

    <a class="home" href="/">Return to SusNetwork</a>
  </main>

  <script>
    const particles = document.getElementById("particles");
    const count = 70;

    for (let i = 0; i < count; i++) {
      const dot = document.createElement("span");

      dot.className = "particle";
      dot.style.top = `${Math.random() * 100}vh`;
      dot.style.left = `${-10 - Math.random() * 20}vw`;
      dot.style.animationDuration = `${12 + Math.random() * 22}s`;
      dot.style.animationDelay = `${-Math.random() * 30}s`;

      particles.appendChild(dot);
    }
  </script>

</body>
</html>
